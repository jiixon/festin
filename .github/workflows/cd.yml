# ====================================
# CD (Continuous Deployment) 워크플로우
# - main 브랜치 push 시 자동 배포
# - Docker Hub에 이미지 푸시
# - EC2에서 최신 이미지로 재시작
# - Docker 레이어 캐시 활용으로 빌드 속도 최적화
# ====================================

name: CD

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # 수동 실행 가능

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      # 1. 코드 체크아웃
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Docker Buildx 설정
      # - 멀티 플랫폼 빌드 지원
      # - 캐싱 최적화
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Docker Hub 로그인
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 4. Docker 메타데이터 생성
      # - latest: 최신 버전
      # - commit SHA: 롤백 시 사용
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/festin
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest

      # 5. Docker 이미지 빌드 및 푸시
      # - 레이어 캐시 활용 (2-3배 속도 향상)
      # - Registry 캐시 사용
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/festin:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/festin:buildcache,mode=max

      # 6. EC2 서버 배포
      # - 최신 이미지 pull
      # - 컨테이너 재시작
      # - Health check로 배포 검증
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          FIREBASE_CREDENTIALS_JSON: ${{ secrets.FIREBASE_CREDENTIALS_JSON }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: JWT_SECRET,FIREBASE_CREDENTIALS_JSON
          script: |
            cd ~/festin

            # Docker Hub 로그인
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

            # 환경 변수 설정
            export DOCKER_IMAGE=${{ secrets.DOCKER_USERNAME }}/festin:latest
            export JWT_SECRET=$JWT_SECRET
            export FIREBASE_CREDENTIALS_JSON=$FIREBASE_CREDENTIALS_JSON

            # 최신 이미지 pull
            docker pull $DOCKER_IMAGE

            # MySQL/Redis/RabbitMQ 먼저 실행 (이미 실행 중이면 스킵)
            docker-compose -f docker-compose.prod.yml up -d mysql redis rabbitmq

            # MySQL/Redis/RabbitMQ 헬스체크 대기
            echo "⏳ Waiting for MySQL, Redis and RabbitMQ to be healthy..."
            sleep 5

            # 기존 app 컨테이너만 정리 (Redis/RabbitMQ는 유지)
            docker stop festin-app || true
            docker rm festin-app || true

            # 모든 로컬 빌드 이미지 삭제 (Docker Hub 이미지를 사용하도록 강제)
            docker rmi festin_app:latest festin_app festin-app:latest festin-app || true

            # 새 app 이미지로 재시작 (--no-deps로 의존성 서비스 재시작 방지)
            docker-compose -f docker-compose.prod.yml up -d --no-deps app

            # Health check (최적화된 간격)
            echo "🔍 Waiting for application to be healthy..."
            MAX_RETRIES=20
            RETRY_COUNT=0
            SLEEP_INTERVAL=3

            while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
              sleep $SLEEP_INTERVAL

              # Custom health endpoint 확인
              # TODO: Actuator 500 에러 해결 후 /actuator/health로 변경
              if curl -f -s http://localhost:8080/api/health > /dev/null 2>&1; then
                echo "✅ Application is healthy!"
                echo "📊 Health check passed after $((RETRY_COUNT * SLEEP_INTERVAL)) seconds"
                break
              fi

              RETRY_COUNT=$((RETRY_COUNT + 1))
              echo "⏳ Retry $RETRY_COUNT/$MAX_RETRIES..."
            done

            # Health check 실패 시
            if [ $RETRY_COUNT -eq $MAX_RETRIES ]; then
              echo "❌ Health check failed after $((MAX_RETRIES * SLEEP_INTERVAL)) seconds"
              echo "📋 Application logs:"
              docker logs festin-app --tail 100
              exit 1
            fi

            # 오래된 이미지 정리 (24시간 이상된 것만)
            echo "🧹 Cleaning up old images..."
            docker image prune -af --filter "until=24h"

            echo "🎉 Deployment completed successfully!"