jwt:
  secret: ${JWT_SECRET}

spring:
  datasource:
    # allowPublicKeyRetrieval: MySQL 8.0 기본 인증(caching_sha2_password) + useSSL=false 조합에서
    #   드라이버가 서버 공개키를 못 받아 "Public Key Retrieval is not allowed" 로 연결 거부되는 것을 허용.
    #   DB 는 동일 호스트의 docker 내부 네트워크(festin-network)에만 노출되므로 평문 키 교환 위험은 없음.
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 30          # 기본 10 → 30
      minimum-idle: 10               # 최소 유휴 연결
      connection-timeout: 30000      # 연결 대기 시간 (30초)
      idle-timeout: 600000           # 유휴 연결 유지 시간 (10분)
      max-lifetime: 1800000          # 연결 최대 수명 (30분)

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

firebase:
  enabled: true
  credentials:
    json: ${FIREBASE_CREDENTIALS_JSON:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
    metrics:
      enabled: true
  health:
    defaults:
      enabled: true
  metrics:
    tags:
      application: festin
    distribution:
      percentiles-histogram:
        http.server.requests: true
        hikaricp.connections.acquire: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99
        hikaricp.connections.acquire: 0.5, 0.95, 0.99